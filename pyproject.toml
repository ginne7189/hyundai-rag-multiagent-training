[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hyundai-rag-multiagent-training"
version = "0.1.0"
description = "Five-day RAG, LangGraph, and multi-agent training repository"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6.11,<0.7",
  "numpy>=2.0,<3",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.45,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1"
]

[project.scripts]
course = "coursekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
